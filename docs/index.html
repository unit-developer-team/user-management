<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>IAC Deploy Visualization</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>デモ用（AWSのサービスが立ち上がっていくイメージ画面）</h1>

  <div id="diagram">

    <!-- Network Layer -->
    <div id="subnet-public" class="box hidden"><span class="box-label">VPCE（VPC Endpoint）</span></div>
    <div id="vpc" class="box hidden"><span class="box-label">VPC</span></div>
    <div id="subnet-private" class="box hidden"><span class="box-label">Private Subnet</span></div>

    <!-- Public Subnet コンポーネント -->
    <div id="alb" class="comp hidden">
      <img src="assets/alb.png" alt="ALB">
      <span>ALB</span>
    </div>
    <div id="vpce" class="comp hidden">
      <img src="assets/vpce.png" alt="VPC Endpoint">
      <span>VPC Endpoint</span>
    </div>
    <div id="ecr" class="comp hidden">
      <img src="assets/ecr.png" alt="ECR">
      <span>ECR</span>
    </div>
    <div id="ecs" class="comp hidden">
      <img src="assets/ecs.png" alt="ECS">
      <span>ECS</span>
    </div>

    <!-- Private Subnet コンポーネント -->
    <div id="cognito" class="comp hidden">
      <img src="assets/cognito.png" alt="Cognito">
      <span>Cognito</span>
    </div>
    <div id="dynamodb" class="comp hidden">
      <img src="assets/dynamodb.png" alt="DynamoDB">
      <span>DynamoDB</span>
    </div>
    <div id="lambda" class="comp hidden">
      <img src="assets/lambda.png" alt="Lambda">
      <span>Lambda</span>
    </div>
    <div id="apigw" class="comp hidden">
      <img src="assets/apigw.png" alt="API Gateway">
      <span>API Gateway</span>
    </div>

    <!-- VPC外 -->
    <div id="s3" class="comp hidden">
      <img src="assets/s3.png" alt="S3">
      <span>S3</span>
    </div>
    <div id="cloudfront" class="comp hidden">
      <img src="assets/cloudfront.png" alt="CloudFront">
      <span>CloudFront</span>
    </div>

  </div>

  <!-- コントロール -->
  <div id="controls">
    <input id="inp-url" type="text" placeholder="https://github.com/owner/repo/actions/runs/123456789">
    <input id="inp-pat" type="password" placeholder="GitHub PAT（任意）">
    <button onclick="startLive()">▶ Live</button>
    <button onclick="runDemo()">▶ Demo</button>
    <button onclick="resetAll()">↺ Reset</button>
    <span id="badge">Idle</span>
  </div>

  <div id="log"></div>

  <script src="script.js"></script>
</body>
</html>

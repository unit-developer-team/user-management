AWSTemplateFormatVersion: 2010-09-09
Description: Lambda function for user management with X-Ray and Secrets Manager access

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, test, prod]
    Description: Environment name
  FunctionName:
    Description: Function Name you want to create.
    Type: String
  AlbDnsNameParam:
    Description: DNS name of the ALB (from ECS stack output).
    Type: String

Resources:
  # ============================================================
  # IAM
  # ============================================================
  SecretsManagerReadPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: !Sub "${Env}-${AWS::StackName}-secrets-read-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "secretsmanager:GetSecretValue"
            Resource: !Sub "arn:aws:secretsmanager:ap-northeast-1:*:secret:/myapp/prod/config*"

  IAMRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
        - !Ref SecretsManagerReadPolicy
      Tags:
        - Key: Env
          Value: !Ref Env

  # ============================================================
  # CloudWatch Logs
  # ============================================================
  LogsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}"
      RetentionInDays: 14

  # ============================================================
  # Lambda Function
  # 初回はダミーコードで作成し、その後 update-function-code で本物を流し込む
  # ============================================================
  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogsLogGroup
    Properties:
      Description: !Sub "${Env} User Management Lambda Function"
      FunctionName: !Ref FunctionName
      Architectures:
        - x86_64
      Handler: handlers/userHandler.handler
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 200,
            body: 'initializing'
          });
      MemorySize: 128
      Role: !GetAtt IAMRole.Arn
      Runtime: nodejs20.x
      Timeout: 30
      Environment:
        Variables:
          ENV: !Ref Env
          ALB_URL: !Sub "http://${AlbDnsNameParam}"
          INTERNAL_TOKEN: !Sub "{{resolve:secretsmanager:/myapp/prod/config:SecretString:INTERNAL_TOKEN}}"
      TracingConfig:
        Mode: Active
      Tags:
        - Key: Env
          Value: !Ref Env

Outputs:
  LambdaArn:
    Description: ARN of the Lambda Function
    Value: !GetAtt LambdaFunction.Arn
    Export:
      Name: !Sub "${Env}-${AWS::StackName}-LambdaArn"

  LambdaRoleArn:
    Description: ARN of the IAM Role used by Lambda
    Value: !GetAtt IAMRole.Arn
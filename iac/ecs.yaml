AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate Task and ALB Infrastructure

Resources:
  # ============================================================
  # 1. ECS Cluster
  # ============================================================
  TestEcsCluster:
    Type: "AWS::ECS::Cluster"
    Properties:
      ClusterName: "user-management-cluster"

  # ============================================================
  # 2. CloudWatch Logs (コンテナのログ出力先)
  # ============================================================
  EcsLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: "/ecs/user-management-api-task"
      RetentionInDays: 14

  # ============================================================
  # 3. Application Load Balancer (ALB) 関連
  # ============================================================

  # ターゲットグループ: ALBからECSタスクへ通信を振り分ける設定
  TestTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      VpcId: !ImportValue "Network-Stack-VpcId" # ネットワークスタックからVPC IDを取得
      Name: "test-target-group"
      Protocol: HTTP
      Port: 3000
      TargetType: ip # Fargateの場合は必ず 'ip' を指定
      HealthCheckPath: "/" # アプリのヘルスチェック用パス（アプリに合わせて変更）
      Matcher:
        HttpCode: "200"

  # ALB本体: インターネットからの入り口
  TestInternetAlb:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    Properties:
      Name: "user-management-alb"
      Scheme: "internet-facing" # 外部公開用
      Type: "application"
      SecurityGroups:
        - !ImportValue "Network-Stack-ALBSecurityGroup" # ネットワークスタックからSGを取得
      Subnets:
        - !ImportValue "Network-Stack-PublicSubnet1" # ネットワークスタックからパブリックサブネット1を取得
        - !ImportValue "Network-Stack-PublicSubnet2" # ネットワークスタックからパブリックサブネット2を取得
      LoadBalancerAttributes:
        - Key: "deletion_protection.enabled"
          Value: false
        - Key: "idle_timeout.timeout_seconds"
          Value: 60

  # ALBリスナー: 80番ポートで受け取った通信をターゲットグループへ流す
  TestAlbListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref TestInternetAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TestTargetGroup

  # ============================================================
  # 4. IAM Roles (権限管理)
  # ============================================================

  # Secrets Manager読み取り用ポリシー
  SecretsManagerReadPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: "test-secretsmanager-read-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "secretsmanager:GetSecretValue"
            Resource: "arn:aws:secretsmanager:ap-northeast-1:*:secret:/myapp/prod/config*"

  # ECSタスク実行ロール: ECSエージェントがイメージ取得やログ出力を行うための権限
  UserEcsTaskExecRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: "test-ecs-task-exec-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - !Ref SecretsManagerReadPolicy

  # ECSタスクロール: コンテナ内のアプリケーションがAWSサービス(DynamoDB等)を操作する権限
  UserEcsTaskRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: "user-management-ecs-task-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !ImportValue "UsersTableArn" # DynamoDBスタックがある前提

  # ============================================================
  # 5. ECS Task Definition & Service
  # ============================================================

  # タスク定義: コンテナのスペックやイメージを指定
  TestEcsTaskDefinition:
    Type: "AWS::ECS::TaskDefinition"
    Properties:
      Family: "user-management-api-task"
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref UserEcsTaskExecRole
      TaskRoleArn: !Ref UserEcsTaskRole
      ContainerDefinitions:
        - Name: "user-management-api"
          Image: !Sub 
            - "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${RepoName}:latest"
            - RepoName: !ImportValue "EcrRepoName"
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: "ecs"
          Environment:
            - Name: TABLE_NAME
              Value: !ImportValue "UsersTableName"
            - Name: INTERNAL_TOKEN
              Value: "{{resolve:secretsmanager:/myapp/prod/config:SecretString:INTERNAL_TOKEN}}"
            - Name: PORT
              Value: "3000"

  # ECSサービス: タスクを維持・ALBと紐付け
  TestEcsService:
    Type: "AWS::ECS::Service"
    DependsOn: TestAlbListener # リスナーができてからサービスを開始
    Properties:
      ServiceName: "user-management-api-service"
      Cluster: !Ref TestEcsCluster
      TaskDefinition: !Ref TestEcsTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: "user-management-api"
          ContainerPort: 3000
          TargetGroupArn: !Ref TestTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED # プライベートサブネットなのでDISABLED
          SecurityGroups:
            - !ImportValue "Network-Stack-ECSSecurityGroup"
          Subnets:
            - !ImportValue "Network-Stack-PrivateSubnet"

# ============================================================
# Outputs
# ============================================================
Outputs:
  TestEcsClusterName:
    Value: !Ref TestEcsCluster
    Export:
      Name: !Sub "${AWS::StackName}-ClusterName"

  AlbDnsName:
    Description: URL to access the application
    Value: !GetAtt TestInternetAlb.DNSName
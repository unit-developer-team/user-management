AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate Task and ALB Infrastructure

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, test, prod]
    Description: Environment name

Resources:
  # ============================================================
  # 1. ECS Cluster
  # ============================================================
  TestEcsCluster:
    Type: "AWS::ECS::Cluster"
    Properties:
      ClusterName: !Sub "${Env}-user-management-cluster"
      Tags:
        - Key: Env
          Value: !Ref Env

  # ============================================================
  # 2. CloudWatch Logs
  # ============================================================
  EcsLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: !Sub "/ecs/${Env}-user-management-api-task"
      RetentionInDays: 14

  # ============================================================
  # 3. ALB関連
  # ============================================================
  TestTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      VpcId: !ImportValue
        Fn::Sub: "${Env}-Network-VpcId"
      Name: !Sub "${Env}-target-group"
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      HealthCheckPath: "/health"
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Env
          Value: !Ref Env

  TestInternetAlb:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    Properties:
      Name: !Sub "${Env}-user-management-alb"
      Scheme: "internet-facing"
      Type: "application"
      SecurityGroups:
        - !ImportValue
          Fn::Sub: "${Env}-Network-ALBSecurityGroup"
      Subnets:
        - !ImportValue
          Fn::Sub: "${Env}-Network-PublicSubnet1"
        - !ImportValue
          Fn::Sub: "${Env}-Network-PublicSubnet2"
      LoadBalancerAttributes:
        - Key: "deletion_protection.enabled"
          Value: false
        - Key: "idle_timeout.timeout_seconds"
          Value: 60
      Tags:
        - Key: Env
          Value: !Ref Env

  TestAlbListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref TestInternetAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TestTargetGroup

  # ============================================================
  # 4. IAM Roles
  # ============================================================
  SecretsManagerReadPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: !Sub "${Env}-ecs-secretsmanager-read-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "secretsmanager:GetSecretValue"
            Resource: !Sub "arn:aws:secretsmanager:ap-northeast-1:*:secret:/myapp/prod/config*"

  UserEcsTaskExecRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${Env}-ecs-task-exec-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - !Ref SecretsManagerReadPolicy
      Tags:
        - Key: Env
          Value: !Ref Env

  UserEcsTaskRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${Env}-ecs-task-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !ImportValue
                  Fn::Sub: "${Env}-UsersTableArn"
      Tags:
        - Key: Env
          Value: !Ref Env

  # ============================================================
  # 5. ECS Task Definition & Service
  # ============================================================
  TestEcsTaskDefinition:
    Type: "AWS::ECS::TaskDefinition"
    Properties:
      Family: !Sub "${Env}-user-management-api-task"
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref UserEcsTaskExecRole
      TaskRoleArn: !Ref UserEcsTaskRole
      ContainerDefinitions:
        - Name: !Sub "${Env}-user-management-api"
          Image: !Sub
            - "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${RepoName}:${Env}-latest"
            - RepoName: !ImportValue
                Fn::Sub: "${Env}-EcrRepoName"
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: "ecs"
          Environment:
            - Name: ENV
              Value: !Ref Env
            - Name: TABLE_NAME
              Value: !ImportValue
                Fn::Sub: "${Env}-UsersTableName"
            - Name: INTERNAL_TOKEN
              Value: !Sub "{{resolve:secretsmanager:/myapp/prod/config:SecretString:INTERNAL_TOKEN}}"
            - Name: PORT
              Value: "3000"
      Tags:
        - Key: Env
          Value: !Ref Env

  TestEcsService:
    Type: "AWS::ECS::Service"
    DependsOn: TestAlbListener
    Properties:
      ServiceName: !Sub "${Env}-user-management-api-service"
      Cluster: !Ref TestEcsCluster
      TaskDefinition: !Ref TestEcsTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      LoadBalancers:
        - ContainerName: !Sub "${Env}-user-management-api"
          ContainerPort: 3000
          TargetGroupArn: !Ref TestTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !ImportValue
              Fn::Sub: "${Env}-Network-ECSSecurityGroup"
          Subnets:
            - !ImportValue
              Fn::Sub: "${Env}-Network-PrivateSubnet"
      Tags:
        - Key: Env
          Value: !Ref Env

Outputs:
  ClusterName:
    Value: !Ref TestEcsCluster
    Export:
      Name: !Sub "${Env}-ECS-ClusterName"

  AlbDnsName:
    Description: URL to access the application
    Value: !GetAtt TestInternetAlb.DNSName
    Export:
      Name: !Sub "${Env}-ECS-AlbDnsName"
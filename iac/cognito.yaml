AWSTemplateFormatVersion: '2010-09-09'
Description: "Cognito User Pool with MFA and SES Integration"

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, test, prod]
    Description: Environment name

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${Env}-UserPool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      UserPoolTags:
        Env: !Ref Env
 
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${Env}-AppClient"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
 
Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "${Env}-Cognito-UserPoolId"
 
  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${Env}-Cognito-UserPoolClientId"
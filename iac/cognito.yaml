AWSTemplateFormatVersion: '2010-09-09'
Description: "Cognito User Pool with MFA and SES Integration"

Resources:
  # 1. ユーザープールの定義
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-UserPool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      # MFA設定: 認証アプリ(TOTP)を必須にする設定
      MfaConfiguration: 'OFF'
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      
      # パスワードポリシー
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7

      # 管理者による作成のみ許可（自己サインアップ禁止）
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

      # SESを利用したメール送信設定
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        From: "no-reply@example.com"
        SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/example.com"

      # スキーマ（標準属性）の明示的な設定
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  # 2. アプリケーションクライアント (アプリから接続するために必要)
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-AppClient"
      UserPoolId: !Ref UserPool
      GenerateSecret: false # フロントエンド(SPA/App)から呼ぶ場合はfalse
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH # 管理者操作などで必要なら

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"
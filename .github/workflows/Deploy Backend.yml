name: Deploy Backend（Lambda / ECS）

# ============================================================
# lambda/ or ecs/ 以下のコード変更時のみ自動実行
# ============================================================
on:
  push:
    branches:
      - develop # → dev環境
      - test    # → test環境
      - main    # → prod環境
    paths:
      - 'lambda/**'
      - 'containers/api/**'

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY_PREFIX: user-management-repo
  LAMBDA_FUNCTION_PREFIX: user-management

jobs:
  # ============================================================
  # デプロイ先の環境を決定
  # ============================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
    steps:
      - name: 環境名を設定
        id: set-env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "test" ]; then
            echo "env_name=test" >> $GITHUB_OUTPUT
          else
            echo "env_name=dev" >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # ECS: Dockerビルド → ECRプッシュ → サービス再デプロイ
  # ============================================================
  deploy-ecs:
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.env_name }}
    env:
      ENV: ${{ needs.setup.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: テスト実行（ECS）
        working-directory: containers/api
        run: |
          npm ci
          npm test

      - name: ECRにログイン
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Dockerビルド＆ECRにプッシュ
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.ENV }}-latest
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ env.ENV }}-${{ env.ECR_REPOSITORY_PREFIX }}:$IMAGE_TAG \
            ./containers/api
          docker push \
            $ECR_REGISTRY/${{ env.ENV }}-${{ env.ECR_REPOSITORY_PREFIX }}:$IMAGE_TAG

      - name: ECSサービスを強制再デプロイ
        run: |
          aws ecs update-service \
            --cluster ${{ env.ENV }}-user-management-cluster \
            --service ${{ env.ENV }}-user-management-api-service \
            --force-new-deployment

  # ============================================================
  # Lambda: ビルド → S3アップロード → 関数コード更新
  # ============================================================
  deploy-lambda:
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ needs.setup.outputs.env_name }}
    env:
      ENV: ${{ needs.setup.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lambda/bff/package-lock.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 依存関係インストール
        working-directory: lambda/bff
        run: npm ci

      - name: TypeScriptビルド
        working-directory: lambda/bff
        run: npm run build

      - name: ZIPに圧縮
        working-directory: lambda/bff/dist
        run: zip -r ../function.zip .

      # CFn管理のS3バケット名を取得（初回デプロイ済み前提）
      - name: LambdaスタックからS3バケット名を取得
        id: lambda-bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.ENV }}-lambda \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaDeployBucketName'].OutputValue" \
            --output text)
          echo "bucket=${BUCKET}" >> $GITHUB_OUTPUT

      - name: S3にアップロード
        working-directory: lambda/bff
        run: |
          aws s3 cp function.zip \
            s3://${{ steps.lambda-bucket.outputs.bucket }}/function.zip

      # ZIPを更新してLambda関数のコードを反映
      - name: Lambda関数のコードを更新
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.ENV }}-${{ env.LAMBDA_FUNCTION_PREFIX }} \
            --s3-bucket ${{ steps.lambda-bucket.outputs.bucket }} \
            --s3-key function.zip